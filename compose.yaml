x-app: &app
  build: ./backend
  environment: &app-environment
    DATABASE_URL: postgresql+psycopg://campusops:${POSTGRES_PASSWORD}@db:5432/campusops
    REDIS_URL: redis://redis:6379/0
    OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
    ORCID_ACCESS_TOKEN: ${ORCID_ACCESS_TOKEN:-}
    WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
    WEBHOOK_SIGNING_SECRET: ${WEBHOOK_SIGNING_SECRET:-}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SOURCE_CA_BUNDLE: ${SOURCE_CA_BUNDLE:-}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campusops
      POSTGRES_USER: campusops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusops"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery", "worker", "-Q", "ingestion", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
  scheduler:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery", "beat", "--loglevel=INFO", "--schedule=/tmp/campusops-beat"]
    depends_on:
      api:
        condition: service_healthy
  control-worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery", "worker", "-Q", "control", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      api:
        condition: service_healthy
  delivery-worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery", "worker", "-Q", "reports,notifications", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
  monitor-worker:
    <<: *app
    command: ["celery", "-A", "app.tasks:celery", "worker", "-Q", "monitoring", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      api:
        condition: service_healthy
  web:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
